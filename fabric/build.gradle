plugins {
	id 'info.solidsoft.pitest' version '1.19.0'
}

dependencies {
	// jqwik 1.10.2 runs on JUnit Platform 1.14; the BOM keeps the rest of JUnit on the same release.
	testImplementation platform('org.junit:junit-bom:5.14.4')
	testImplementation 'net.jqwik:jqwik:1.10.2'
	testImplementation 'org.junit.jupiter:junit-jupiter-api'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.named('testRuntimeClasspath') {
	// With fabric-loader-junit on the test classpath, Gradle discovered none of DimensionStructureVariants'
	// jqwik properties (dsv-r1-unit, 14 Nov). The unit tests need no Fabric loader.
	exclude group: 'net.fabricmc', module: 'fabric-loader-junit'
}

pitest {
	pitestVersion = '1.30.2'
	junit5PluginVersion = '1.2.3'
	targetClasses = [
		'io.github.brainage04.floodedend.EndShipMooring',
		'io.github.brainage04.floodedend.EndCityAtSea',
		'io.github.brainage04.floodedend.EndIslandStructures*',
	]
	targetTests = ['io.github.brainage04.floodedend.*Test']
	additionalMutableCodePaths = project(':common').sourceSets.main.output.classesDirs.files
	threads = 1
	timeoutConstInMillis = 5000
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}
tasks.named('pitest') {
	dependsOn ':common:classes'
}
